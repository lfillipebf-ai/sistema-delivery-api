spring.application.name=sistema-delivery-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/delivery}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:delivery}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:delivery}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
